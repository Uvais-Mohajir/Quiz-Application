<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/admin/home}" class="navbar-brand fw-bold">Admin Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/admin/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-light">ManageUser</a>
            <a th:href="@{/admin/exams}" class="btn btn-sm btn-light">ManageExam</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4">
            <h1 class="h4 fw-bold mb-1">Exam Details</h1>
            <p class="mb-0 text-secondary">Click Exam ID to open exam result details page.</p>
        </div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Exam ID</th>
                    <th>Title</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Questions</th>
                    <th>Registered</th>
                    <th>Submitted</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${exams}">
                    <td>
                        <a th:href="@{'/admin/exams/' + ${row.examId} + '/results'}">
                            <code th:text="${row.examId}">id</code>
                        </a>
                    </td>
                    <td th:text="${row.title}">Title</td>
                    <td th:text="${row.startTime}">start</td>
                    <td th:text="${row.endTime}">end</td>
                    <td th:text="${row.questionCount}">0</td>
                    <td th:text="${row.registeredCount}">0</td>
                    <td th:text="${row.submittedCount}">0</td>
                    <td>
                        <span th:if="${row.finished}" class="badge text-bg-secondary">Finished</span>
                        <span th:if="${!row.finished}" class="badge text-bg-success">Active/Scheduled</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(exams)}">
                    <td colspan="8" class="text-center text-secondary py-4">No exams found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
