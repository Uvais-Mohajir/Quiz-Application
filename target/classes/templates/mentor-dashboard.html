<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/mentor/home}" class="navbar-brand fw-bold">Mentor Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/mentor/home}" class="btn btn-sm btn-light">Home</a>
            <a th:href="@{/mentor/create-exam}" class="btn btn-sm btn-outline-light">Create Exam</a>
            <a th:href="@{/mentor/exams}" class="btn btn-sm btn-outline-light">Manage Exam</a>
            <a th:href="@{/mentor/results}" class="btn btn-sm btn-outline-light">Manage Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div class="row g-3">
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body">
                    <p class="small text-secondary mb-1">No of Exam Active</p>
                    <h2 class="h3 fw-bold mb-0" th:text="${activeExamCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body">
                    <p class="small text-secondary mb-1">No of Question Added</p>
                    <h2 class="h3 fw-bold mb-0" th:text="${questionCount}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body">
                    <p class="small text-secondary mb-1">Total Exams</p>
                    <h2 class="h3 fw-bold mb-0" th:text="${totalExamCount}">0</h2>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
