<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <span class="navbar-brand fw-bold">Email Verification</span>
        <a th:href="@{/login}" class="btn btn-sm btn-outline-light ms-auto">Login</a>
    </div>
</nav>
<main class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 p-4">
                    <h1 class="h4 fw-bold mb-1">Verify Your Email</h1>
                    <p class="mb-0 text-secondary">Enter the 6-digit OTP sent to your email.</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.message}" class="alert alert-success py-2" th:text="${param.message}"></div>
                    <div th:if="${message}" class="alert alert-success py-2" th:text="${message}"></div>
                    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                    <form th:action="@{/verify-otp}" method="post" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">OTP</label>
                            <input type="text" name="otp" class="form-control" minlength="6" maxlength="6" required>
                        </div>
                        <div class="col-12 d-grid d-md-flex gap-2">
                            <button type="submit" class="btn btn-primary">Verify OTP</button>
                        </div>
                    </form>
                    <form th:action="@{/verify-otp/resend}" method="post" class="mt-3 d-flex gap-2">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="email" th:value="${email}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Resend OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
</body>
</html>
