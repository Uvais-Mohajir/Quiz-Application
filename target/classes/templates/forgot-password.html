<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <span class="navbar-brand fw-bold">Password Recovery</span>
        <a th:href="@{/login}" class="btn btn-sm btn-outline-light ms-auto">Back to Login</a>
    </div>
</nav>

<main class="container py-4 py-md-5">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 p-4">
                    <h1 class="h5 fw-bold mb-1">Step 1: Send OTP</h1>
                    <p class="mb-0 text-secondary">Enter your registered email to receive password reset OTP.</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${message}" class="alert alert-success py-2" th:text="${message}"></div>
                    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                    <form th:action="@{/forgot-password/send-otp}" method="post" class="d-grid gap-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Send OTP</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 p-4">
                    <h2 class="h5 fw-bold mb-1">Step 2: Reset Password</h2>
                    <p class="mb-0 text-secondary">Use OTP from email and set new password.</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/forgot-password/reset}" method="post" class="d-grid gap-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" required>
                        </div>
                        <div>
                            <label class="form-label fw-semibold">OTP</label>
                            <input type="text" name="otp" minlength="6" maxlength="6" class="form-control" required>
                        </div>
                        <div>
                            <label class="form-label fw-semibold">New Password</label>
                            <input type="password" name="newPassword" minlength="6" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Reset Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
</body>
</html>
