<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/mentor/home}" class="navbar-brand fw-bold">Mentor Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/mentor/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/mentor/create-exam}" class="btn btn-sm btn-light">Create Exam</a>
            <a th:href="@{/mentor/exams}" class="btn btn-sm btn-outline-light">Manage Exam</a>
            <a th:href="@{/mentor/results}" class="btn btn-sm btn-outline-light">Manage Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <section class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4">
            <h1 class="h4 fw-bold mb-1">Create Exam</h1>
            <p class="mb-0 text-secondary">Add minimum 3 questions before participants can register.</p>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/mentor/exams}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-12">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Description</label>
                    <input type="text" name="description" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Duration (mins)</label>
                    <input type="number" name="durationMinutes" min="1" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Start Time</label>
                    <input type="datetime-local" name="startTime" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">End Time</label>
                    <input type="datetime-local" name="endTime" class="form-control" required>
                </div>
                <div class="col-12 d-grid d-md-flex">
                    <button type="submit" class="btn btn-primary">Create Exam</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
