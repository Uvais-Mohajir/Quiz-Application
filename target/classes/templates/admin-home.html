<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <span class="navbar-brand fw-bold">Admin Panel</span>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
        </form>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4">
            <h1 class="h4 mb-1 fw-bold">User & Mentor Management</h1>
            <p class="mb-0 text-secondary">Approve mentors and manage account access</p>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="fw-semibold" th:text="${user.name}">Name</td>
                    <td th:text="${user.email}">Email</td>
                    <td><span class="badge text-bg-secondary" th:text="${user.role}">Role</span></td>
                    <td>
                        <span th:if="${user.approved}" class="badge text-bg-success">Approved</span>
                        <span th:if="${!user.approved}" class="badge text-bg-warning">Blocked/Pending</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex flex-wrap justify-content-end gap-2">
                            <form th:if="${user.role.name() == 'MENTOR' and !user.approved}"
                                  th:action="@{'/admin/approve-mentor/' + ${user.id}}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-primary">Approve Mentor</button>
                            </form>

                            <form th:if="${user.approved}"
                                  th:action="@{'/admin/block-user/' + ${user.id}}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Block</button>
                            </form>

                            <form th:if="${!user.approved}"
                                  th:action="@{'/admin/unblock-user/' + ${user.id}}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-success">Unblock</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
