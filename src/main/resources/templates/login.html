<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/index}" class="navbar-brand fw-bold">Online Quiz Application</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/index}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/index#about-us}" class="btn btn-sm btn-outline-light">About Us</a>
            <a th:href="@{/register}" class="btn btn-sm btn-outline-light">Register</a>
            <a th:href="@{/login}" class="btn btn-sm btn-light">Login</a>
            <a th:href="@{/index#contact-us}" class="btn btn-sm btn-outline-light">Contact us</a>
        </div>
    </div>
</nav>
<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header portal-card-header p-4 border-0">
                    <h1 class="h4 mb-1 fw-bold">Quiz Practice Portal</h1>
                    <p class="mb-0 text-light-emphasis">Login to continue mock tests and analysis</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div th:if="${param.error}" class="alert alert-danger py-2">Invalid email or password</div>
                    <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out</div>
                    <div th:if="${param.message}" class="alert alert-success py-2" th:text="${param.message}"></div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold mb-2">Login As</label>
                        <ul class="nav nav-tabs role-switch" id="loginRoleTabs">
                            <li class="nav-item flex-fill">
                                <button class="nav-link active w-100" type="button">Participant</button>
                            </li>
                            <li class="nav-item flex-fill">
                                <button class="nav-link w-100" type="button">Mentor</button>
                            </li>
                            <li class="nav-item flex-fill">
                                <button class="nav-link w-100" type="button">Admin</button>
                            </li>
                        </ul>
                    </div>

                    <form th:action="@{/login}" method="post" class="d-grid gap-3">
                        <div>
                            <label for="username" class="form-label fw-semibold">Email</label>
                            <input id="username" type="email" name="username" class="form-control form-control-lg" required>
                        </div>
                        <div>
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input id="password" type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                    </form>

                    <p class="mt-4 mb-0 text-secondary small">
                        New user?
                        <a class="fw-semibold text-decoration-none" th:href="@{/register}">Create account</a>
                    </p>
                    <p class="mt-2 mb-0 text-secondary small">
                        Forgot password?
                        <a class="fw-semibold text-decoration-none" th:href="@{/forgot-password}">Reset with OTP</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script>
    (function () {
        const tabs = document.querySelectorAll('#loginRoleTabs .nav-link');
        tabs.forEach((tab) => {
            tab.addEventListener('click', function () {
                tabs.forEach((btn) => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });
    })();
</script>
</body>
</html>
