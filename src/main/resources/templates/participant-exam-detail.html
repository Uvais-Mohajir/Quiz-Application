<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/participant/home}" class="navbar-brand fw-bold">Participant Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/participant/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/participant/exams}" class="btn btn-sm btn-light">Exam Detail</a>
            <a th:href="@{/participant/results}" class="btn btn-sm btn-outline-light">Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <section class="card border-0 shadow-sm rounded-4">
        <div class="card-body">
            <h1 class="h4 fw-bold mb-1" th:text="${exam.title}">Exam</h1>
            <p class="mb-1 text-secondary" th:text="${exam.description}">Description</p>
            <p class="mb-1">Exam ID: <code th:text="${exam.id}">id</code></p>
            <p class="mb-1">Start Date: <span th:text="${exam.startTime}">start</span></p>
            <p class="mb-1">End Date: <span th:text="${exam.endTime}">end</span></p>
            <p class="mb-1">No of Question: <strong th:text="${questionCount}">0</strong></p>
            <p class="mb-3">No of Student Register: <strong th:text="${registeredCount}">0</strong></p>

            <div class="d-flex flex-wrap gap-2">
                <form th:if="${!registered}" th:action="@{'/participant/register-exam/' + ${exam.id}}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <a th:if="${canStart}" th:href="@{'/participant/exam-session/' + ${exam.id}}" class="btn btn-warning">Start your exam</a>
                <span th:if="${registered and !canStart and !submitted}" class="badge text-bg-secondary align-self-center">Registered</span>
                <span th:if="${submitted}" class="badge text-bg-success align-self-center">Already Submitted</span>
            </div>
        </div>
    </section>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
