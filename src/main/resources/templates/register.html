<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/index}" class="navbar-brand fw-bold">Online Quiz Application</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/index}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/index#about-us}" class="btn btn-sm btn-outline-light">About Us</a>
            <a th:href="@{/register}" class="btn btn-sm btn-light">Register</a>
            <a th:href="@{/login}" class="btn btn-sm btn-outline-light">Login</a>
            <a th:href="@{/index#contact-us}" class="btn btn-sm btn-outline-light">Contact us</a>
        </div>
    </div>
</nav>
<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header portal-card-header p-4 border-0">
                    <h1 class="h4 mb-1 fw-bold">Create Your Portal Account</h1>
                    <p class="mb-0 text-light-emphasis">Join as participant or mentor. OTP email verification is required.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                    <form th:action="@{/register}" method="post" class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold mb-2">Select Role</label>
                            <ul class="nav nav-tabs role-switch" id="roleTabs">
                                <li class="nav-item flex-fill">
                                    <button class="nav-link active w-100" type="button" data-role="PARTICIPANT">
                                        Candidate
                                    </button>
                                </li>
                                <li class="nav-item flex-fill">
                                    <button class="nav-link w-100" type="button" data-role="MENTOR">
                                        Mentor
                                    </button>
                                </li>
                            </ul>
                            <input type="hidden" id="role" name="role" th:value="${role != null ? role : 'PARTICIPANT'}">
                        </div>
                        <div class="col-12">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input id="name" type="text" name="name" class="form-control" th:value="${name}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input id="email" type="email" name="email" class="form-control" th:value="${email}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input id="password" type="password" name="password" minlength="6" class="form-control" required>
                        </div>
                        <div class="col-12 d-grid d-md-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Create Account</button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary px-4">Go to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script>
    (function () {
        const tabs = document.querySelectorAll('#roleTabs .nav-link');
        const roleField = document.getElementById('role');
        const selectedRole = (roleField.value || 'PARTICIPANT').toUpperCase();
        tabs.forEach((btn) => {
            btn.classList.toggle('active', btn.getAttribute('data-role') === selectedRole);
        });
        tabs.forEach((tab) => {
            tab.addEventListener('click', function () {
                tabs.forEach((btn) => btn.classList.remove('active'));
                this.classList.add('active');
                roleField.value = this.getAttribute('data-role');
            });
        });
    })();
</script>
</body>
</html>
