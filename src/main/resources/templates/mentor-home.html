<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <span class="navbar-brand fw-bold">Mentor Workspace</span>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
        </form>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <section class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-header bg-white border-0 p-4">
            <h2 class="h5 fw-bold mb-1">Create New Exam</h2>
            <p class="mb-0 text-secondary">After creating, click Exam ID in table to add/upload questions and view results after finish.</p>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/mentor/exams}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-12">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Description</label>
                    <input type="text" name="description" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Duration (mins)</label>
                    <input type="number" name="durationMinutes" min="1" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Start Time</label>
                    <input type="datetime-local" name="startTime" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">End Time</label>
                    <input type="datetime-local" name="endTime" class="form-control" required>
                </div>
                <div class="col-12 d-grid d-md-flex">
                    <button type="submit" class="btn btn-primary">Create Exam</button>
                </div>
            </form>
        </div>
    </section>

    <section class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4 d-flex justify-content-between align-items-center">
            <h2 class="h5 fw-bold mb-0">My Exams</h2>
            <span class="badge text-bg-primary" th:text="${examCount} + ' Total'">0 Total</span>
        </div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Exam Title</th>
                    <th>Exam ID</th>
                    <th>Start</th>
                    <th>End</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="exam : ${mentorExams}">
                    <td class="fw-semibold" th:text="${exam.title}">Exam title</td>
                    <td>
                        <a th:href="@{'/mentor/exams/' + ${exam.examId}}">
                            <code th:text="${exam.examId}">examId</code>
                        </a>
                    </td>
                    <td th:text="${exam.startTime}">start</td>
                    <td th:text="${exam.endTime}">end</td>
                </tr>
                <tr th:if="${#lists.isEmpty(mentorExams)}">
                    <td colspan="4" class="text-center text-secondary py-4">No exams created yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
