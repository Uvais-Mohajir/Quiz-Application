<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <span class="navbar-brand fw-bold">Dashboard Router</span>
    </div>
</nav>
<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <h2 class="h4 fw-bold">Dashboard</h2>
        <p class="text-secondary mb-4">Role-based redirection is enabled. Use this page as fallback.</p>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>
</div>
<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
