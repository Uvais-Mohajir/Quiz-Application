<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg" data-disable-idle-logout="true">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/participant/home}" class="navbar-brand fw-bold">Participant Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/participant/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/participant/exams}" class="btn btn-sm btn-outline-light">Exam Detail</a>
            <a th:href="@{/participant/results}" class="btn btn-sm btn-outline-light">Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <section class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h5 fw-bold mb-1" th:text="${exam.title}">Exam</h1>
                <p class="mb-0 text-secondary">Questions shown one by one. Full screen required.</p>
            </div>
            <div class="badge text-bg-danger fs-6">
                Time Left: <span id="countdown">--:--</span>
            </div>
        </div>
        <div class="card-body p-4">
            <div id="examGuardBox" class="exam-guard">
                <p class="mb-2"><strong>Exam Security Mode:</strong> Start in fullscreen. Tab switch or fullscreen exit auto submits your exam.</p>
                <button id="startExamBtn" type="button" class="btn btn-warning btn-sm">Start Exam In Fullscreen</button>
            </div>

            <form id="examForm" th:action="@{/participant/submit-exam}" method="post">
                <input type="hidden" id="remainingSeconds" th:value="${remainingSeconds}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="examId" th:value="${selectedExamId}">

                <div th:each="question,iter : ${questions}" class="question-step question-block mb-4" th:attr="data-step=${iter.index}">
                    <p class="fw-semibold mb-2">
                        Q<span th:text="${iter.count}">1</span>.
                        <span th:text="${question.questionText}">Question</span>
                    </p>
                    <div class="vstack gap-2">
                        <label th:each="opt : ${question.options}" class="option-item">
                            <input class="form-check-input me-2"
                                   type="radio"
                                   th:name="${'answer_' + question.questionId}"
                                   th:value="${opt}">
                            <span th:text="${opt}">Option</span>
                        </label>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <button id="prevBtn" type="button" class="btn btn-outline-secondary">Previous</button>
                    <div>
                        <span id="stepLabel" class="small text-secondary"></span>
                    </div>
                    <button id="nextBtn" type="button" class="btn btn-primary">Next</button>
                    <button id="submitBtn" type="submit" class="btn btn-success d-none">Submit Exam</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>

<script>
    (function () {
        const remainingField = document.getElementById('remainingSeconds');
        const countdown = document.getElementById('countdown');
        const startExamBtn = document.getElementById('startExamBtn');
        const examGuardBox = document.getElementById('examGuardBox');
        const form = document.getElementById('examForm');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const stepLabel = document.getElementById('stepLabel');
        const steps = Array.from(document.querySelectorAll('.question-step'));
        let remaining = remainingField ? parseInt(remainingField.value || '0', 10) : 0;
        let examStarted = false;
        let examClosed = false;
        let currentStep = 0;

        function format(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        function showStep(index) {
            steps.forEach((el, idx) => {
                el.classList.toggle('d-none', idx !== index);
            });
            stepLabel.textContent = 'Question ' + (index + 1) + ' / ' + steps.length;
            prevBtn.disabled = index === 0;
            const onLast = index === steps.length - 1;
            nextBtn.classList.toggle('d-none', onLast);
            submitBtn.classList.toggle('d-none', !onLast);
        }

        function setInputsEnabled(enabled) {
            form.querySelectorAll('input[type="radio"]').forEach((i) => {
                i.disabled = !enabled;
            });
            prevBtn.disabled = !enabled;
            nextBtn.disabled = !enabled;
            submitBtn.disabled = !enabled;
        }

        function forceSubmit() {
            if (!form) {
                return;
            }
            form.submit();
        }

        function closeExam(reason) {
            if (examClosed) {
                return;
            }
            examClosed = true;
            alert(reason + " Exam will be auto submitted.");
            forceSubmit();
        }

        function tick() {
            if (!countdown || !form || examClosed || !examStarted) {
                return;
            }
            countdown.textContent = format(Math.max(remaining, 0));
            if (remaining <= 0) {
                closeExam("Time over.");
                return;
            }
            remaining -= 1;
            setTimeout(tick, 1000);
        }

        document.addEventListener("visibilitychange", function () {
            if (examStarted && !examClosed && document.hidden) {
                closeExam("Tab switch detected.");
            }
        });

        document.addEventListener("fullscreenchange", function () {
            if (examStarted && !examClosed && !document.fullscreenElement) {
                closeExam("Fullscreen exited.");
            }
        });

        nextBtn.addEventListener('click', function () {
            if (currentStep < steps.length - 1) {
                currentStep += 1;
                showStep(currentStep);
            }
        });

        prevBtn.addEventListener('click', function () {
            if (currentStep > 0) {
                currentStep -= 1;
                showStep(currentStep);
            }
        });

        startExamBtn.addEventListener("click", async function () {
            try {
                await document.documentElement.requestFullscreen();
                examStarted = true;
                examGuardBox.style.display = "none";
                setInputsEnabled(true);
                tick();
            } catch (e) {
                alert("Fullscreen permission is required.");
            }
        });

        showStep(0);
        setInputsEnabled(false);
    })();
</script>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
