<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/mentor/home}" class="navbar-brand fw-bold">Mentor Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/mentor/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/mentor/create-exam}" class="btn btn-sm btn-outline-light">Create Exam</a>
            <a th:href="@{/mentor/exams}" class="btn btn-sm btn-outline-light">Manage Exam</a>
            <a th:href="@{/mentor/results}" class="btn btn-sm btn-light">Manage Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4">
            <h1 class="h4 fw-bold mb-1">Finished Exam Result</h1>
            <p class="mb-0 text-secondary">Click exam id to open detailed exam result.</p>
        </div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Exam ID</th>
                    <th>Title</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Registered</th>
                    <th>Submitted</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${mentorResultRows}">
                    <td>
                        <a th:href="@{'/mentor/exams/' + ${row.exam.examId}}">
                            <code th:text="${row.exam.examId}">id</code>
                        </a>
                    </td>
                    <td th:text="${row.exam.title}">title</td>
                    <td th:text="${row.exam.startTime}">start</td>
                    <td th:text="${row.exam.endTime}">end</td>
                    <td th:text="${row.registeredCount}">0</td>
                    <td th:text="${row.submittedCount}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(mentorResultRows)}">
                    <td colspan="6" class="text-center text-secondary py-4">No finished exam yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
