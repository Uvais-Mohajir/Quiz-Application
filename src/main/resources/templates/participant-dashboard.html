<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/participant/home}" class="navbar-brand fw-bold">Participant Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/participant/home}" class="btn btn-sm btn-light">Home</a>
            <a th:each="row : ${startNowRows}"
               th:href="@{'/participant/exam-session/' + ${row.exam.examId}}"
               class="btn btn-sm btn-warning">Start ur exam</a>
            <a th:href="@{/participant/exams}" class="btn btn-sm btn-outline-light">Exam Detail</a>
            <a th:href="@{/participant/results}" class="btn btn-sm btn-outline-light">Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <h1 class="h4 fw-bold mb-0">Active Exams for Register</h1>
        <span class="badge text-bg-primary" th:text="${activeExamCount} + ' Active'">0 Active</span>
    </div>

    <div class="row g-3">
        <div class="col-12 col-lg-6" th:each="row : ${participantExamRows}">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="h6 fw-bold mb-0" th:text="${row.exam.title}">Exam Title</h2>
                        <span th:if="${row.canStart}" class="badge text-bg-success">Start Now</span>
                        <span th:if="${!row.canStart}" class="badge text-bg-secondary">Scheduled</span>
                    </div>
                    <p class="small text-secondary mb-2" th:text="${row.exam.description}">desc</p>
                    <p class="small mb-1">Exam ID: <code th:text="${row.exam.examId}">id</code></p>
                    <p class="small mb-3">Start: <span th:text="${row.exam.startTime}">s</span> | End: <span th:text="${row.exam.endTime}">e</span></p>
                    <div class="d-flex flex-wrap gap-2">
                        <form th:if="${!row.registered}" th:action="@{'/participant/register-exam/' + ${row.exam.examId}}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-primary">Register</button>
                        </form>
                        <a th:if="${row.registered}" th:href="@{'/participant/exams/' + ${row.exam.examId}}" class="btn btn-sm btn-outline-primary">View Detail</a>
                        <a th:if="${row.canStart}" th:href="@{'/participant/exam-session/' + ${row.exam.examId}}" class="btn btn-sm btn-warning">Start your exam</a>
                        <span th:if="${row.submitted}" class="badge text-bg-success align-self-center">Submitted</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
