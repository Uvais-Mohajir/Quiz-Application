<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/participant/home}" class="navbar-brand fw-bold">Participant Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/participant/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/participant/exams}" class="btn btn-sm btn-outline-light">Exam Detail</a>
            <a th:href="@{/participant/results}" class="btn btn-sm btn-light">Result</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4">
            <h1 class="h4 fw-bold mb-1">Result Details</h1>
            <p class="mb-0 text-secondary">Score, start time, end time, and submission details.</p>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Exam ID</th>
                    <th>Exam Title</th>
                    <th>Score</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Submitted At</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="result : ${results}">
                    <td><code th:text="${result.examId}">id</code></td>
                    <td th:text="${result.examTitle}">title</td>
                    <td><span class="badge text-bg-primary" th:text="${result.score}">0</span></td>
                    <td th:text="${result.attemptStartAt}">start</td>
                    <td th:text="${result.attemptEndAt}">end</td>
                    <td th:text="${result.submittedAt}">submitted</td>
                    <td>
                        <span th:if="${result.submitted}" class="badge text-bg-success">Submitted</span>
                        <span th:if="${!result.submitted}" class="badge text-bg-warning">Pending</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="7" class="text-center text-secondary py-4">No result found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
