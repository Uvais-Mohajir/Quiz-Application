<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="portal-bg">
<nav class="navbar navbar-expand-lg navbar-dark portal-topbar">
    <div class="container">
        <a th:href="@{/admin/home}" class="navbar-brand fw-bold">Admin Panel</a>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a th:href="@{/admin/home}" class="btn btn-sm btn-outline-light">Home</a>
            <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-light">ManageUser</a>
            <a th:href="@{/admin/exams}" class="btn btn-sm btn-light">ManageExam</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <section class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
            <h1 class="h4 fw-bold mb-2" th:text="${exam.title}">Exam</h1>
            <p class="mb-1">Exam ID: <code th:text="${exam.id}">id</code></p>
            <p class="mb-1">Registered: <strong th:text="${registeredCount}">0</strong></p>
            <p class="mb-0">Submitted: <strong th:text="${submittedCount}">0</strong></p>
        </div>
    </section>

    <section class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 p-4">
            <h2 class="h5 fw-bold mb-0">Result Details</h2>
        </div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Score</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Submitted At</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${resultRows}">
                    <td th:text="${row.studentName}">name</td>
                    <td th:text="${row.studentEmail}">email</td>
                    <td><span class="badge text-bg-primary" th:text="${row.score}">0</span></td>
                    <td th:text="${row.attemptStartAt}">time</td>
                    <td th:text="${row.attemptEndAt}">time</td>
                    <td th:text="${row.submittedAt}">time</td>
                </tr>
                <tr th:if="${#lists.isEmpty(resultRows)}">
                    <td colspan="6" class="text-center text-secondary py-4">No submitted results yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="portal-footer">
    <div class="container">
        <div>Online Quiz Application &copy; 2026</div>
        <div>Developed by Uvais</div>
    </div>
</footer>
<script th:src="@{/js/idle-session.js}"></script>
</body>
</html>
